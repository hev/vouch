services:
  nats:
    image: nats:2.11-alpine
    command:
      - --jetstream
      - --user
      - vouch
      - --pass
      - test-only
      - --http_port
      - "8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 1s
      timeout: 1s
      retries: 30

  nats-init:
    image: natsio/nats-box:0.18.0
    depends_on:
      nats:
        condition: service_healthy
    command:
      - sh
      - -eu
      - -c
      - >-
        nats --server nats://nats:4222 --user vouch --password test-only
        stream info OSHIOKI >/dev/null 2>&1 ||
        nats --server nats://nats:4222 --user vouch --password test-only
        stream add OSHIOKI --subjects 'oshioki.request.>,oshioki.auth.>' --storage memory
        --retention limits --discard old --max-age 10m --defaults

  server:
    build:
      context: .
      target: server
    depends_on:
      nats-init:
        condition: service_completed_successfully
    user: "${VOUCH_UID:?set VOUCH_UID}"
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: vouch
      NATS_PASS: test-only
      # Dev-only: `nats` is a Compose hostname, not loopback, so the TLS
      # gate needs this opt-out here. Production uses tls://.
      VOUCH_ALLOW_PLAINTEXT_NATS: "1"
      VOUCH_STATE_PATH: /state/state.sqlite3
      VOUCH_LISTEN: 0.0.0.0:8443
      VOUCH_ORIGIN: https://sudo.test
      VOUCH_RP_ID: sudo.test
      RUST_LOG: info
    volumes:
      - ${VOUCH_STATE_ROOT:?set VOUCH_STATE_ROOT}/server:/state
    ports:
      - 127.0.0.1:${VOUCH_HTTP_PORT:-8443}:8443
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8443/healthz"]
      interval: 1s
      timeout: 2s
      retries: 45

  e2e:
    build:
      context: .
      target: e2e
    depends_on:
      server:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: vouch
      NATS_PASS: test-only
      # Dev-only, same reason as the server above.
      VOUCH_ALLOW_PLAINTEXT_NATS: "1"
      VOUCH_TEST_CONFIG_DIR: /state/hook
      VOUCH_ORIGIN: https://sudo.test
      VOUCH_RP_ID: sudo.test
      VOUCH_SERVER_HTTP: http://server:8443
      VOUCH_E2E_IN_CONTAINER: "1"
      VOUCH_E2E_SKIP_BUILD: "1"
      VOUCH_E2E_PREBUILT: "1"
      VOUCH_HOST_UID: ${VOUCH_HOST_UID:?set VOUCH_HOST_UID}
    volumes:
      - ${VOUCH_STATE_ROOT:?set VOUCH_STATE_ROOT}/e2e:/state
    networks:
      default:
        aliases:
          - sudo.test
